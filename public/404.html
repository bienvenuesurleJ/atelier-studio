<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Atelier Local</title>
    <script>
      ;(function () {
        var base = '/atelier-studio/'
        var path = location.pathname || '/'
        var rest = path.indexOf(base) === 0 ? path.slice(base.length - 1) : path
        if (!rest || rest === '/') rest = '/'
        if (rest.charAt(0) !== '/') rest = '/' + rest
        location.replace(base + '#' + rest + location.search)
      })()
    </script>
    <meta http-equiv="refresh" content="0; url=/atelier-studio/" />
  </head>
  <body>
    <p><a href="/atelier-studio/">Ouvrir Atelier Local</a></p>
  </body>
</html>
